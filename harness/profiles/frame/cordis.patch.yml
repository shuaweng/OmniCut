- insert:
    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'
    - id: llm
      name: '@deepseek-ai/dsh-llm'
    - id: session
      name: '@deepseek-ai/dsh-session'
    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'
    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false
        # 主会话 persona 由 workflow-prompt.mjs 注册；子代理使用自己的 persona。
    - id: tools
      name: '@deepseek-ai/dsh-tools'
    - id: agent
      name: '@deepseek-ai/dsh-agent'
    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'
    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        maxParallelToolCalls: 1
        agents: []
    - id: model
      name: '@deepseek-ai/dsh-llm-pi-ai'
      config:
        providers:
          frame-agent:
            displayName: Claude 任务执行
            apiKeyEnv: !!js process.env.FRAME_ANTHROPIC_KEY_ENV || 'CREATIVE_API_KEY'
            api: anthropic-messages
            baseURL: !!js process.env.FRAME_ANTHROPIC_BASE_URL || 'http://127.0.0.1:0/unconfigured'
            cacheRetention: short
            reasoning: !!js process.env.FRAME_ANTHROPIC_REASONING_EFFORT || 'high'
            defaultMaxTokens: !!js Number(process.env.FRAME_ANTHROPIC_MAX_TOKENS || 32768)
            models:
              - id: !!js process.env.FRAME_ANTHROPIC_MODEL || 'claude-sonnet-5-5'
                contextWindow: !!js Number(process.env.FRAME_ANTHROPIC_CONTEXT || 393216)
                maxTokens: !!js Number(process.env.FRAME_ANTHROPIC_MAX_TOKENS || 32768)
                input: [ 'text', 'image' ]
                reasoningEfforts: { low: low, medium: medium, high: high }
                compat:
                  forceAdaptiveThinking: true
                  supportsTemperature: false
                  supportsCacheControlOnTools: true
            retryPolicy: { mode: normal, maxRetries: 1 }
          frame-deepseek:
            displayName: DeepSeek 任务执行
            apiKeyEnv: DEEPSEEK_API_KEY
            api: openai-completions
            baseURL: !!js process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com'
            defaultMaxTokens: 393216
            models:
              - id: !!js process.env.DEEPSEEK_MODEL || 'deepseek-flash'
                contextWindow: 1048576
                maxTokens: 393216
                input: [ 'text', 'image' ]
                reasoningEfforts: {max: max}
                compat:
                  thinkingFormat: deepseek
                  supportsReasoningEffort: true
                  requiresReasoningContentOnAssistantMessages: true
            retryPolicy:
              mode: normal
              maxRetries: 1
    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js process.env.FRAME_SESSION_DIR
        compression: none
    - id: frame-bridge
      name: '../../plugin.mjs'
