- id: system-prompt
  config:
    includeHarnessIdentity: false
    includeRuntimeContext: true
    # 主会话 persona 由 workflow-prompt.mjs 注册；子代理使用自己的 persona。
- id: agent-preset-registry
  config: { default: frame }
- id: agent-default-model
  config:
    provider: frame-agent
    model: claude-opus-5-5
    reasoningEffort: low
- id: llm-pi-ai
  config:
    providers:
      frame-creative:
        requestImagePixelBudget: 2097152
        requestImageMaxBytes: 393216
        maxRequestImageBytes: 6291456
        displayName: 创意与理解
        apiKeyEnv: CREATIVE_API_KEY
        api: !!js process.env.CREATIVE_PROTOCOL || 'anthropic-messages'
        baseURL: !!js >-
          (process.env.CREATIVE_BASE_URL ||
          'http://127.0.0.1:0/unconfigured').replace(/\/$/, '') +
          ((process.env.CREATIVE_BASE_URL && process.env.CREATIVE_PROTOCOL ===
          'openai-completions' && !/\/v1\/?$/.test(process.env.CREATIVE_BASE_URL
          || '')) ? '/v1' : '')
        defaultMaxTokens: 32768
        # Opus 5.5 accepts adaptive thinking, not legacy enabled/budget_tokens.
        # Medium keeps the 32k total output cap and avoids defaulting to max.
        reasoning: !!js process.env.FRAME_CREATIVE_REASONING_EFFORT || 'medium'
        models:
          - id: !!js process.env.CREATIVE_MODEL || 'claude-opus-5-5'
            contextWindow: 393216
            maxTokens: 32768
            input: [ 'text', 'image' ]
            reasoningEfforts: { low: low, medium: medium, high: high }
            compat:
              forceAdaptiveThinking: true
              supportsTemperature: false
              supportsCacheControlOnTools: true
        retryPolicy: { mode: normal, maxRetries: 0 }
      frame-agent:
        requestImagePixelBudget: 2097152
        requestImageMaxBytes: 393216
        maxRequestImageBytes: 6291456
        displayName: Claude 任务执行
        apiKeyEnv: !!js process.env.FRAME_ANTHROPIC_KEY_ENV || 'CREATIVE_API_KEY'
        api: anthropic-messages
        baseURL: !!js process.env.FRAME_ANTHROPIC_BASE_URL ||
          'http://127.0.0.1:0/unconfigured'
        cacheRetention: short
        reasoning: !!js process.env.FRAME_ANTHROPIC_REASONING_EFFORT || 'high'
        defaultMaxTokens: !!js Number(process.env.FRAME_ANTHROPIC_MAX_TOKENS || 32768)
        models:
          - id: !!js process.env.FRAME_ANTHROPIC_MODEL || 'claude-sonnet-5-5'
            contextWindow: !!js Number(process.env.FRAME_ANTHROPIC_CONTEXT || 393216)
            maxTokens: !!js Number(process.env.FRAME_ANTHROPIC_MAX_TOKENS || 32768)
            input: [ 'text', 'image' ]
            reasoningEfforts: { low: low, medium: medium, high: high }
            compat:
              forceAdaptiveThinking: true
              supportsTemperature: false
              supportsCacheControlOnTools: true
        retryPolicy: { mode: normal, maxRetries: 1 }
      frame-deepseek:
        displayName: DeepSeek 任务执行
        apiKeyEnv: DEEPSEEK_API_KEY
        api: openai-completions
        baseURL: !!js process.env.DEEPSEEK_BASE_URL || 'https://api.deepseek.com'
        defaultMaxTokens: 393216
        models:
          - id: !!js process.env.DEEPSEEK_MODEL || 'deepseek-flash'
            contextWindow: 1048576
            maxTokens: 393216
            # Editable declarations in the native Models settings; capabilities
            # follow the selected model metadata rather than an id heuristic.
            input: [ 'text', 'image' ]
            reasoningEfforts: { max: max }
            compat:
              thinkingFormat: deepseek
              supportsReasoningEffort: true
              requiresReasoningContentOnAssistantMessages: true
        retryPolicy: { mode: normal, maxRetries: 1 }
- id: subagent-model-selection-settings
  config:
    enabled: true
    allowedModels: !!js >-
      [
        {provider: 'frame-creative', model: process.env.CREATIVE_MODEL || 'claude-opus-5-5'},
        {provider: 'frame-agent', model: process.env.FRAME_ANTHROPIC_MODEL || 'claude-sonnet-5-5'},
        {provider: 'frame-deepseek', model: process.env.DEEPSEEK_MODEL || 'deepseek-flash'}
      ]
- id: session-persistence-jsonl
  config:
    root: !!js process.env.FRAME_SESSION_DIR
    compression: none
- id: storage-json
  config:
    root: !!js process.env.FRAME_DSH_STORAGE
- id: agent-loop
  config: { maxParallelToolCalls: 1, agents: [] }
- id: webserver
  config:
    host: '127.0.0.1'
    port: !!js Number(process.env.FRAME_DSH_PORT || 5182)
- id: web-runtime
  config:
    {
      openBrowser: false,
      printUrl: false,
      surfaceContext: false,
      trustedHosts: []
    }
- id: sandbox-policy
  config:
    mode: workspace-write
    workspaceRoot: !!js process.env.FRAME_CODE_ROOT
    protectedPaths: !!js JSON.parse(process.env.FRAME_PROTECTED_CONFIG || '{}').protectedPaths || []
    protectedPathPatterns: !!js JSON.parse(process.env.FRAME_PROTECTED_CONFIG ||
      '{}').protectedPathPatterns || []
- id: permission
  config:
    presets:
      workspace-write: { sandbox: workspace-write, approval: ask }
- id: ui-brand-official
  disabled: true
# Video workspaces must not display developer edits from the enclosing app Git
# checkout. Retain native delivery cards and code tools, only replace the recorder.
- id: workspace-changes
  name: '../../disable-parent-git-changes.mjs'
- id: session-title-llm
  disabled: true
- id: preset-standard
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-ptc
  disabled: true
- id: preset-cordis
  disabled: true
- id: hmr
  disabled: true
- id: client-hmr
  disabled: true
# The chat and home composer load every client plugin in one bundle. OmniCut
# owns accounts, models and files itself; these developer panels added 5MB+
# (account settings alone embeds 5MB of images) and no creative function.
- id: ui-settings-account
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-shell
  disabled: true
- id: ui-settings-agent-loop
  disabled: true
- id: ui-settings-subagent
  disabled: true
- id: ui-settings-web-search
  disabled: true
- id: ui-settings-session-log
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: ui-sidebar-files
  disabled: true
# @ lists project media, the shared library and motions (frame-ui), not the
# Agent's working files, conversations or subagents.
- id: ui-reference
  disabled: true
- insert:
    - id: preset-frame
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: frame
        order: 1
        plugins:
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config: { sampleOverCapGlobResults: false }
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
            config:
              completionDelivery: wakeup
              maxConsecutiveWakes: 8
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              watch: false
              workspaceSkillDirs: [ '.skills' ]
              customSkillDirs:
                - !!js process.env.FRAME_SKILLS_DIR
                - !!js process.env.FRAME_HYPIT_SKILLS_DIR
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config: { allowParallelInProgress: true }
    - id: frame-creative-director
      name: '../../creative-director.mjs'
    - id: frame-bridge
      name: '../../plugin.mjs'
    - id: frame-ui
      name: '../../frame-ui/index.mjs'
- id: ui-theme
  config: { preference: dark, fontSize: 14 }
- id: locale
  config:
    preference: zh-Hans-x-frame
- insert:
    - id: frame-mcp
      name: '../../mcp-bootstrap.mjs'
# Creators chat in the conversation view; the trajectory tab, code diffs and
# preset seat follow the native developer switch, which starts off here.
- id: ui-settings
  config: { enabled: false }
# Work steps stay folded under one creative heading per group; running steps
# do not append tool arguments (workspace paths) or the model's raw thinking.
- id: ui-chat
  config: { transcriptView: compact }
- id: ui-settings-general
  name: "@deepseek-ai/dsh-client-ui-settings-general"
  config:
    welcomeNoticeVersion: 2026-09-28.1

- id: ui-conversation
  config:
    busyEnter: steer
